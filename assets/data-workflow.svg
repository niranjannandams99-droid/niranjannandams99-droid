<svg width="900" height="170" viewBox="0 0 900 170" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wfBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <style>
      .step-rect { fill: #0B0F19; stroke: #1C2333; stroke-width: 1.2; }
      .step-label { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #E6EDF3; letter-spacing: 0.6px; }
      .step-num { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; fill: #22D3EE; letter-spacing: 1px; }
      @keyframes flow { 0% { stroke-dashoffset: 24; } 100% { stroke-dashoffset: 0; } }
      .flowline { stroke-dasharray: 4 4; animation: flow 1s linear infinite; }
    </style>
  </defs>
  <rect width="900" height="170" fill="url(#wfBg)"/>
  <rect x="0.5" y="0.5" width="899" height="169" fill="none" stroke="#1C2333"/>

  <!-- 7 steps -->
  <g>
    <!-- step boxes generated with fixed x positions -->
    <rect x="12" y="60" width="110" height="50" rx="8" class="step-rect"/>
    <text x="67" y="80" text-anchor="middle" class="step-num">01</text>
    <text x="67" y="94" text-anchor="middle" class="step-label">RAW DATA</text>

    <rect x="138" y="60" width="110" height="50" rx="8" class="step-rect"/>
    <text x="193" y="80" text-anchor="middle" class="step-num">02</text>
    <text x="193" y="94" text-anchor="middle" class="step-label">CLEANING</text>

    <rect x="264" y="60" width="110" height="50" rx="8" class="step-rect"/>
    <text x="319" y="80" text-anchor="middle" class="step-num">03</text>
    <text x="319" y="94" text-anchor="middle" class="step-label">EDA</text>

    <rect x="390" y="60" width="120" height="50" rx="8" class="step-rect"/>
    <text x="450" y="80" text-anchor="middle" class="step-num">04</text>
    <text x="450" y="94" text-anchor="middle" class="step-label">FEATURE ENG.</text>

    <rect x="522" y="60" width="120" height="50" rx="8" class="step-rect"/>
    <text x="582" y="80" text-anchor="middle" class="step-num">05</text>
    <text x="582" y="94" text-anchor="middle" class="step-label">MODEL / ANALYSIS</text>

    <rect x="654" y="60" width="115" height="50" rx="8" class="step-rect"/>
    <text x="711" y="80" text-anchor="middle" class="step-num">06</text>
    <text x="711" y="94" text-anchor="middle" class="step-label">VISUALIZATION</text>

    <rect x="780" y="60" width="108" height="50" rx="8" class="step-rect" stroke="#A78BFA"/>
    <text x="834" y="80" text-anchor="middle" class="step-num" fill="#A78BFA">07</text>
    <text x="834" y="94" text-anchor="middle" class="step-label">INSIGHTS</text>

    <!-- connectors -->
    <line x1="122" y1="85" x2="138" y2="85" stroke="#22D3EE" stroke-width="1.5" class="flowline"/>
    <line x1="248" y1="85" x2="264" y2="85" stroke="#22D3EE" stroke-width="1.5" class="flowline"/>
    <line x1="374" y1="85" x2="390" y2="85" stroke="#22D3EE" stroke-width="1.5" class="flowline"/>
    <line x1="510" y1="85" x2="522" y2="85" stroke="#22D3EE" stroke-width="1.5" class="flowline"/>
    <line x1="642" y1="85" x2="654" y2="85" stroke="#A78BFA" stroke-width="1.5" class="flowline"/>
    <line x1="769" y1="85" x2="780" y2="85" stroke="#A78BFA" stroke-width="1.5" class="flowline"/>
  </g>

  <text x="450" y="140" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8B95A7" letter-spacing="0.5">how i work with data — from raw tables to decisions people act on</text>
</svg>
