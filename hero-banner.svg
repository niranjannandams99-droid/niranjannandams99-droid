<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="55%" stop-color="#080B14"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="78%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroGlow2" cx="88%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#1C2333"/>
    </pattern>
    <clipPath id="typeClip">
      <rect x="0" y="0" width="0" height="40">
        <animate attributeName="width" from="0" to="620" dur="2.6s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
      </rect>
    </clipPath>
    <style>
      .hero-eyebrow { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #22D3EE; letter-spacing: 4px; }
      .hero-name { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 42px; font-weight: 700; fill: #F0F6FC; }
      .hero-type { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 20px; font-weight: 500; fill: #A78BFA; }
      .hero-desc { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14.5px; fill: #8B95A7; }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      .cursor { animation: blink 1s step-end infinite; }
      @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(6px,-10px); } }
      @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-8px,8px); } }
      @keyframes drift3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(5px,9px); } }
      .p1 { animation: drift1 5s ease-in-out infinite; }
      .p2 { animation: drift2 6.5s ease-in-out infinite; }
      .p3 { animation: drift3 4.5s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1000" height="300" fill="url(#heroBg)"/>
  <rect width="1000" height="300" fill="url(#heroGlow)"/>
  <rect width="1000" height="300" fill="url(#heroGlow2)"/>
  <rect x="600" y="0" width="400" height="300" fill="url(#dotGrid)" opacity="0.5"/>
  <rect x="0.5" y="0.5" width="999" height="299" fill="none" stroke="#1C2333"/>

  <!-- floating data-grid nodes on the right -->
  <g stroke="#22D3EE" stroke-width="1" opacity="0.35">
    <line x1="700" y1="70" x2="790" y2="120" class="p1"/>
    <line x1="790" y1="120" x2="760" y2="200" class="p2"/>
    <line x1="760" y1="200" x2="860" y2="230" class="p3"/>
    <line x1="700" y1="70" x2="840" y2="90" class="p2"/>
    <line x1="840" y1="90" x2="900" y2="170" class="p1"/>
  </g>
  <g>
    <circle cx="700" cy="70" r="4" fill="#22D3EE" class="p1"/>
    <circle cx="790" cy="120" r="3.5" fill="#A78BFA" class="p2"/>
    <circle cx="760" cy="200" r="4" fill="#22D3EE" class="p3"/>
    <circle cx="860" cy="230" r="3.5" fill="#A78BFA" class="p1"/>
    <circle cx="840" cy="90" r="3" fill="#67E8F9" class="p3"/>
    <circle cx="900" cy="170" r="4.5" fill="#22D3EE" class="p2"/>
    <circle cx="930" cy="80" r="3" fill="#A78BFA" class="p1"/>
    <circle cx="620" cy="150" r="3" fill="#67E8F9" class="p2"/>
  </g>

  <!-- text block -->
  <text x="48" y="70" class="hero-eyebrow">DATA ANALYST · PORTFOLIO</text>
  <text x="48" y="122" class="hero-name">Hi, I'm Niranjan Nandam</text>

  <g>
    <clipPath id="typeClip2">
      <rect x="0" y="0" width="0" height="34">
        <animate attributeName="width" from="0" to="600" dur="2.4s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1" keyTimes="0;1" values="0;600"/>
      </rect>
    </clipPath>
    <g clip-path="url(#typeClip2)">
      <text x="48" y="163" class="hero-type">Data Analyst • Python • SQL • Power BI • ML</text>
    </g>
    <rect x="628" y="140" width="2.5" height="24" fill="#A78BFA" class="cursor">
      <animate attributeName="x" from="48" to="628" dur="2.4s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1" keyTimes="0;1" values="48;628"/>
    </rect>
  </g>

  <text x="48" y="205" class="hero-desc">
    <tspan x="48" dy="0">I transform raw data into meaningful insights, interactive dashboards,</tspan>
    <tspan x="48" dy="20">and intelligent solutions.</tspan>
  </text>

  <text x="48" y="265" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5B6577" letter-spacing="0.5">ECE Graduate → Instrumentation Engineer → Data Analytics &amp; Data Science</text>
</svg>
